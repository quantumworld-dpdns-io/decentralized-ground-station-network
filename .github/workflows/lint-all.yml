name: Mega Linter
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mega-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mega-Linter
        uses: oxsecurity/megalinter/flavors/ci_light@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          DEFAULT_BRANCH: main
          ENABLE_LINTERS: |
            GO_GOLANGCI_LINT,
            GO_REVIVE,
            RUST_CLIPPY,
            PYTHON_RUFF,
            PYTHON_BLACK,
            PYTHON_MYPY,
            JAVASCRIPT_ES,
            TYPESCRIPT_ES,
            YAML_PRETTIER,
            YAML_YAMLLINT,
            MARKDOWN_MARKDOWN_LINT,
            DOCKERFILE_HADOLINT,
            ACTION_ACTIONLINT,
            JSON_JSONLINT,
            REPOSITORY_CHECKOV,
            REPOSITORY_DEVSKIM,
            SPELL_CSPELL
          PRINT_ALPACA: false
          SHOW_ELAPSED_TIME: true
          FAIL_IF_MISSING_LINTER_IN_FLAVOR: true
          GITHUB_COMMENT_REPORTER: true
          GITHUB_STATUS_REPORTER: true
      - name: Generate lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-linter-reports
          path: mega-linter-out/
      - name: Report summary
        if: always()
        run: |
          if [ -f mega-linter-out/summary.txt ]; then
            cat mega-linter-out/summary.txt >> $GITHUB_STEP_SUMMARY
          fi
