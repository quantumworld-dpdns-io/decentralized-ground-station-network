name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run full test suite including integration tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22.0"
  RUST_VERSION: "1.78.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  JULIA_VERSION: "1.10.4"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: Lint Go
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: src/backend
          args: --timeout=5m

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Lint Rust
        working-directory: src/crypto-kernel
        run: cargo clippy --all-targets --features pqc -- -D warnings 2>/dev/null || cargo clippy --all-targets -- -D warnings

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint Python
        uses: astral-sh/ruff-action@v1
        with:
          src: src/quantum-engine

      - name: Shellcheck
        run: |
          find scripts/ -name "*.sh" -exec shellcheck {} \+

  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/backend/go.sum

      - name: Build
        working-directory: src/backend
        run: go build -o /dev/null ./cmd/dgsn-server/

      - name: Test
        working-directory: src/backend
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        with:
          file: src/backend/coverage.out
          flags: go

  build-rust:
    name: Build Rust Crypto Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build (default)
        working-directory: src/crypto-kernel
        run: cargo build --features pqc

      - name: Test
        working-directory: src/crypto-kernel
        run: cargo test --features pqc

  build-python:
    name: Build Python Quantum Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/quantum-engine/pyproject.toml

      - name: Install dependencies
        working-directory: src/quantum-engine
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: src/quantum-engine
        run: python -m pytest --verbose --cov=. --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v6
        with:
          file: src/quantum-engine/coverage.xml
          flags: python

  build-julia:
    name: Build Julia Signal Processing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Test
        working-directory: src/signal-processing
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test()
          '

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        working-directory: src/frontend
        run: npm ci

      - name: Build
        working-directory: src/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go, build-rust, build-python, build-julia, build-frontend]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: deployments/docker/Dockerfile.backend
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}

      - name: Build and push crypto
        uses: docker/build-push-action@v6
        with:
          context: src/crypto-kernel
          file: deployments/docker/Dockerfile.crypto
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/crypto:${{ env.IMAGE_TAG }}

      - name: Build and push quantum engine
        uses: docker/build-push-action@v6
        with:
          context: src/quantum-engine
          file: deployments/docker/Dockerfile.quantum
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/quantum:${{ env.IMAGE_TAG }}

      - name: Build and push signal processing
        uses: docker/build-push-action@v6
        with:
          context: src/signal-processing
          file: deployments/docker/Dockerfile.signal
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/signal:${{ env.IMAGE_TAG }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go, build-rust, build-python, build-julia]
    if: github.event_name == 'push' || github.event.inputs.run_full_suite == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose -f deployments/docker/docker-compose.yml up -d postgres redis
          sleep 10

      - name: Health check
        run: |
          docker compose -f deployments/docker/docker-compose.yml ps

      - name: Stop services
        if: always()
        run: docker compose -f deployments/docker/docker-compose.yml down

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-images, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Deploying ${{ github.ref_name }} to production..."
