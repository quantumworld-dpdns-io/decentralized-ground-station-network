name: Semantic Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Force publish release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@6
            @semantic-release/github@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger downstream releases
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          gh workflow run release-drafter.yml --ref main
          gh workflow run release-packages.yml --ref main
          gh workflow run release-docker.yml --ref main
          gh workflow run release-helm.yml --ref main
          gh workflow run release-goreleaser.yml --ref main
          gh workflow run release-pypi.yml --ref main
          gh workflow run release-crates.yml --ref main
          gh workflow run release-npm.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
