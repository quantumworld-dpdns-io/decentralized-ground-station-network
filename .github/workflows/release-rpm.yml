name: RPM Package Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm-build
      - name: Build RPM
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > ~/rpmbuild/SPECS/dgsn.spec <<EOF
          Name: dgsn
          Version: ${VERSION}
          Release: 1%{?dist}
          Summary: Decentralized Ground Station Network
          License: MIT
          URL: https://dgsn.io
          Source0: %{name}-%{version}.tar.gz
          BuildRequires: golang-bin, rust, python3, cmake
          Requires: openssl

          %description
          A decentralized satellite ground station network with
          post-quantum cryptography and quantum computing integration.

          %prep
          %setup -q

          %build
          make build

          %install
          mkdir -p %{buildroot}%{_bindir}
          install -m 755 build/dgsn %{buildroot}%{_bindir}/dgsn

          %files
          %{_bindir}/dgsn
          %doc LICENSE README.md

          %changelog
          * $(date +"%a %b %d %Y") DGSN Team <dev@dgsn.io> - ${VERSION}
          - Release v${VERSION}
          EOF
          tar czf ~/rpmbuild/SOURCES/dgsn-${VERSION}.tar.gz .
          rpmbuild -ba ~/rpmbuild/SPECS/dgsn.spec
      - name: Sign RPM with GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          rpm --addsign ~/rpmbuild/RPMS/**/dgsn-*.rpm
      - name: Upload RPM to release
        uses: softprops/action-gh-release@v2
        with:
          files: ~/rpmbuild/RPMS/**/dgsn-*.rpm
      - name: Publish to yum repository
        run: |
          echo "Publishing to yum repository..."
