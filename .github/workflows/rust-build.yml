name: Rust Build
on:
  push:
    branches: [main, develop]
    paths: ['src/crypto-kernel/**', '**/Cargo.toml', '**/Cargo.lock', '**.rs']
  pull_request:
    branches: [main]
    paths: ['src/crypto-kernel/**', '**/Cargo.toml', '**/Cargo.lock', '**.rs']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: src/crypto-kernel
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, pqc, pqc,full]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build (default features)
        if: matrix.features == 'default'
        run: cargo build --release --locked
      - name: Build (PQC features)
        if: matrix.features == 'pqc'
        run: cargo build --release --locked --features pqc
      - name: Build (all features)
        if: matrix.features == 'full'
        run: cargo build --release --locked --all-features
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-kernel-${{ matrix.os }}-${{ matrix.features }}
          path: ${{ env.WORKING_DIR }}/target/release/libcrypto_kernel*
          retention-days: 7
