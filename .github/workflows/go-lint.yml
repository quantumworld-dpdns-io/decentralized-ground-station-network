name: Go Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  WORKING_DIR: src/backend

jobs:
  golangci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.WORKING_DIR }}
          args: --timeout=5m --out-format=colored-line-number,github-actions
          only-new-issues: true
      - name: go vet
        run: go vet ./...
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
