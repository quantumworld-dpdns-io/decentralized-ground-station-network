name: Docker Image Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io

jobs:
  release:
    strategy:
      matrix:
        service:
          - name: backend
            dockerfile: deployments/docker/Dockerfile.backend
          - name: frontend
            dockerfile: deployments/docker/Dockerfile.frontend
          - name: crypto
            dockerfile: deployments/docker/Dockerfile.crypto
          - name: quantum
            dockerfile: deployments/docker/Dockerfile.quantum
          - name: signal
            dockerfile: deployments/docker/Dockerfile.signal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate tags
        id: tags
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tags=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:${VERSION},${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:latest,${{ env.DOCKERHUB_REGISTRY }}/dgsn/${{ matrix.service.name }}:${VERSION},${{ env.DOCKERHUB_REGISTRY }}/dgsn/${{ matrix.service.name }}:latest" >> $GITHUB_OUTPUT
      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
