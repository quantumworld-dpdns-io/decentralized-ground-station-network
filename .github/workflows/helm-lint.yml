name: Helm Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - dgsn-backend
          - dgsn-crypto
          - dgsn-quantum
          - dgsn-signal
          - dgsn-frontend
          - dgsn-infra
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
      - name: Helm lint chart
        run: helm lint deployments/helm/${{ matrix.chart }} --strict
      - name: Helm template validation
        run: helm template test deployments/helm/${{ matrix.chart }} --validate
      - name: Install chart-testing
        run: |
          wget -q https://github.com/helm/chart-testing/releases/latest/download/chart-testing_Linux_x86_64.tar.gz
          tar xzf chart-testing_Linux_x86_64.tar.gz
          sudo mv ct /usr/local/bin/
      - name: Chart-testing lint
        run: |
          ct lint --charts deployments/helm/${{ matrix.chart }} --validate-maintainers=false
