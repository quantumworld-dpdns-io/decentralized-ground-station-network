name: Helm Lint
on:
  push:
    branches: [main, develop]
    paths: ['deployments/helm/**']
  pull_request:
    branches: [main]
    paths: ['deployments/helm/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - dgsn-backend
          - dgsn-crypto
          - dgsn-quantum
          - dgsn-signal
          - dgsn-frontend
          - dgsn-infra
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
      - name: Lint chart
        run: |
          helm lint deployments/helm/${{ matrix.chart }} --strict
      - name: Template chart
        run: |
          helm template test deployments/helm/${{ matrix.chart }}
      - name: Check YAML validity
        run: |
          for f in deployments/helm/${{ matrix.chart }}/templates/*.yaml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "Valid: $f"
          done
      - name: Dry run install
        run: |
          helm install --dry-run --debug test deployments/helm/${{ matrix.chart }}
