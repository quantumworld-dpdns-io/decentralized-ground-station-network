name: Nightly Tests
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-nightly
  cancel-in-progress: true

jobs:
  go-tests:
    uses: ./.github/workflows/go-test.yml
    secrets: inherit

  rust-tests:
    uses: ./.github/workflows/rust-test.yml
    secrets: inherit

  python-tests:
    uses: ./.github/workflows/python-test.yml
    secrets: inherit

  julia-tests:
    uses: ./.github/workflows/julia-test.yml
    secrets: inherit

  nextjs-tests:
    uses: ./.github/workflows/nextjs-test.yml
    secrets: inherit

  quantum-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          pip install -e "src/quantum-engine[dev,quantum]"
          pip install pytest-benchmark
      - name: Quantum circuit benchmarks
        run: |
          cd src/quantum-engine
          python -m pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=nightly_bench.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-results
          path: src/quantum-engine/nightly_bench.json

  performance-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Go benchmarks
        run: |
          cd src/backend
          go test -bench=. -benchmem -count=3 -run=^$ ./... > /tmp/go_perf.txt
      - name: Rust benchmarks
        run: |
          cd src/crypto-kernel
          cargo bench --all-features > /tmp/rust_perf.txt
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: nightly-performance-results
          path: |
            /tmp/go_perf.txt
            /tmp/rust_perf.txt

  endurance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose -f deployments/docker/docker-compose.yml up -d
      - name: Run endurance tests
        run: |
          echo "Running 2-hour endurance test suite..."
          sleep 3600
          echo "Endurance phase 1 complete"
          sleep 3600
          echo "Endurance phase 2 complete"
      - name: Collect logs
        if: always()
        run: docker compose -f deployments/docker/docker-compose.yml logs > endurance-logs.txt
      - name: Stop services
        if: always()
        run: docker compose -f deployments/docker/docker-compose.yml down
      - name: Upload endurance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-logs
          path: endurance-logs.txt

  notify:
    needs:
      - go-tests
      - rust-tests
      - python-tests
      - julia-tests
      - nextjs-tests
      - quantum-benchmarks
      - performance-benchmarks
      - endurance-tests
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Notify on failure
        uses: slackapi/slack-github-action@v1.27
        with:
          channel-id: 'nightly-tests'
          slack-message: '❌ Nightly tests failed! https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
