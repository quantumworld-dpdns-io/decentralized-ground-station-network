name: Julia Test
on:
  push:
    branches: [main, develop]
    paths: ['src/signal-processing/**', '**/Project.toml']
  pull_request:
    branches: [main]
    paths: ['src/signal-processing/**', '**/Project.toml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/signal-processing

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        julia-version: ['1.10', '1.11']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run tests
        uses: julia-actions/julia-test@v1
        with:
          prefix: 'using Pkg; Pkg.activate(".");'
      - name: Test coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: julia
