name: Julia Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/signal-processing
  JULIA_VERSION: '1.10'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v3
      - name: Run Pkg tests
        uses: julia-actions/julia-test@v1
        with:
          prefix: 'using Pkg; Pkg.activate(".");'
      - name: Run DSP-specific tests
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.test(test_args=["dsp"])'
      - name: Integration tests with signal files
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.test(test_args=["integration"])'
      - name: Upload coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: julia
