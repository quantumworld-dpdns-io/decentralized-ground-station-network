name: Go Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  WORKING_DIR: src/backend

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum
      - name: Tidy modules
        run: go mod tidy
      - name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w -X main.Version=${{ github.sha }}" -o dgsn-backend-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./cmd/server
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dgsn-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.WORKING_DIR }}/dgsn-backend-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7
