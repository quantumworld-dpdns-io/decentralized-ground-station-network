name: Go Build & Test
on:
  push:
    branches: [main, develop]
    paths: ['src/backend/**', '**.go', 'go.mod', 'go.sum']
  pull_request:
    branches: [main]
    paths: ['src/backend/**', '**.go', 'go.mod', 'go.sum']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'
  WORKING_DIR: src/backend

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKING_DIR }}/go.sum
      - name: Tidy modules
        run: go mod tidy
      - name: Build (${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w -X main.Version=${{ github.sha }}" -o dgsn-backend-${{ matrix.arch }} ./cmd/server
      - name: Cross-compile (linux/arm64)
        if: runner.os == 'Linux' && matrix.arch == 'amd64'
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dgsn-backend-linux-arm64 ./cmd/server
      - name: Test
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.WORKING_DIR }}/coverage.out
          flags: go
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dgsn-backend-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.WORKING_DIR }}/dgsn-backend-${{ matrix.arch }}
          retention-days: 7
