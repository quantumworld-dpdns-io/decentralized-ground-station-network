name: Julia Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/signal-processing
  JULIA_VERSION: '1.10'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@v2
      - name: Instantiate package
        run: julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
      - name: Build sysimage with PackageCompiler
        run: |
          julia -e '
            using Pkg
            Pkg.activate(".")
            Pkg.add("PackageCompiler")
            using PackageCompiler
            create_sysimage(:SignalProcessing, sysimage_path="SignalProcessing.so",
              precompile_execution_file="precompile.jl")
          '
      - name: Cache sysimage
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKING_DIR }}/SignalProcessing.so
          key: sysimage-${{ matrix.os }}-${{ hashFiles('**/Project.toml', '**/Manifest.toml') }}
      - name: Upload sysimage
        uses: actions/upload-artifact@v4
        with:
          name: signal-processing-sysimage-${{ matrix.os }}
          path: ${{ env.WORKING_DIR }}/SignalProcessing.so
          retention-days: 7
