name: Container Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    strategy:
      matrix:
        image: [backend, frontend, crypto, quantum, signal]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.image }}-latest
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.image }}-latest
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library
          scanners: vuln,secret
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: container-${{ matrix.image }}
      - name: Generate summary
        run: |
          echo "## Container Scan: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          trivy image --quiet --severity CRITICAL,HIGH \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ matrix.image }}-latest \
            >> $GITHUB_STEP_SUMMARY
