name: Python Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/quantum-engine
  PYTHON_VERSION: '3.12'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry
      - name: Configure Poetry
        run: poetry config virtualenvs.create true
      - name: Install dependencies
        run: poetry install
      - name: Build wheel
        run: poetry build
      - name: Check wheel validity
        run: pip install twine && twine check dist/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: quantum-engine-wheel-${{ matrix.os }}
          path: ${{ env.WORKING_DIR }}/dist/*.whl
          retention-days: 7
