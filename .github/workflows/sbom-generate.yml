name: SBOM Generate
on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dgsn-sbom.spdx.json
      - name: Upload SBOM to Dependency Graph
        uses: anchore/sbom-action/push-to-dependency-graph@v0
        with:
          file: dgsn-sbom.spdx.json
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgsn-sbom
          path: dgsn-sbom.spdx.json
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dgsn-sbom.spdx.json
