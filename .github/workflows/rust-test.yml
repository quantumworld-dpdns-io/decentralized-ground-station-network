name: Rust Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: src/crypto-kernel

jobs:
  test:
    strategy:
      matrix:
        features: [default, pqc, full]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Test all features
        if: matrix.features == 'full'
        run: cargo test --all-features -- --nocapture
      - name: Test no-default-features
        if: matrix.features == 'default'
        run: cargo test --no-default-features -- --nocapture
      - name: Test with features
        if: matrix.features == 'pqc'
        run: cargo test --features pqc -- --nocapture
      - name: Doc tests
        if: matrix.features == 'full'
        run: cargo test --all-features --doc

  codecov:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --all-features --out Xml --output-dir coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ${{ env.WORKING_DIR }}/coverage/cobertura.xml
          flags: rust
