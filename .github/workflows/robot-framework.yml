name: Robot Framework Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROBOT_DIR: tests/robot-framework

jobs:
  robot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ROBOT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install robotframework robotframework-seleniumlibrary robotframework-requests robotframework-sshlibrary
      - name: Run Robot Framework tests
        run: |
          robot --outputdir results --variablefile variables.resource suites/
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: ${{ env.ROBOT_DIR }}/results/
      - name: Publish Robot Framework report
        uses: joonvena/robotframework-reporter-action@v2
        with:
          report_path: ${{ env.ROBOT_DIR }}/results
          github_token: ${{ secrets.GITHUB_TOKEN }}
