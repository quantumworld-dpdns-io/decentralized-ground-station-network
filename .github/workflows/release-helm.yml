name: Helm Chart Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version'
        required: true

env:
  OCI_REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart:
          - dgsn-backend
          - dgsn-crypto
          - dgsn-quantum
          - dgsn-signal
          - dgsn-frontend
          - dgsn-infra
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Log in to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.OCI_REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Package chart
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          helm package deployments/helm/${{ matrix.chart }} \
            --version "${VERSION#v}" \
            --app-version "${VERSION#v}" \
            --destination ./
      - name: Push to OCI
        run: |
          helm push ${{ matrix.chart }}-*.tgz oci://${{ env.OCI_REGISTRY }}/${{ github.repository }}/charts
      - name: Generate index
        run: |
          helm repo index . --url oci://${{ env.OCI_REGISTRY }}/${{ github.repository }}/charts
      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: helm-index-${{ matrix.chart }}
          path: index.yaml
