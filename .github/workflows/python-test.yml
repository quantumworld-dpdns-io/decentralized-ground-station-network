name: Python Test
on:
  push:
    branches: [main, develop]
    paths: ['src/quantum-engine/**', 'pyproject.toml']
  pull_request:
    branches: [main]
    paths: ['src/quantum-engine/**', 'pyproject.toml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/quantum-engine

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.WORKING_DIR }}/pyproject.toml
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,quantum]"
      - name: Run pytest
        run: |
          python -m pytest tests/ -v --cov=quantum_engine --cov-report=xml --cov-report=term-missing \
            -k "not slow" --timeout=120 -x
      - name: Run quantum module tests
        run: |
          python -m pytest tests/ -v -k "quantum or circuit or gate" --timeout=300
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.WORKING_DIR }}/coverage.xml
          flags: python

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -e ".[dev,test,quantum]"
      - name: Integration tests
        run: python -m pytest tests/ -v -k "integration or e2e" --timeout=600
