name: Python Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: src/quantum-engine
  PYTHON_VERSION: '3.12'

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev,test,quantum]"
          pip install pytest-xdist pytest-cov pytest-benchmark
      - name: Run tests with xdist
        run: python -m pytest tests/ -v -n auto --cov=quantum_engine --cov-report=xml --cov-report=term-missing -k "not slow" --timeout=120
      - name: Run quantum-specific tests
        run: python -m pytest tests/ -v -n auto --quantum --benchmark-only --benchmark-json=quantum_bench.json
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.WORKING_DIR }}/coverage.xml
          flags: python
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: python-benchmarks-${{ matrix.python-version }}
          path: ${{ env.WORKING_DIR }}/quantum_bench.json
