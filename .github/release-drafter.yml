name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🔐 Security'
    labels:
      - 'security'
      - 'pqc'
      - 'cryptography'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'testing'
      - 'e2e'
      - 'integration'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
      - 'adr'
      - 'rfc'
  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'benchmark'
      - 'optimization'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'dependencies'
      - 'ci'
  - title: '🌍 Infrastructure'
    labels:
      - 'cloud'
      - 'terraform'
      - 'helm'
      - 'deployment'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'security'
      - 'dependencies'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
autolabeler:
  - label: 'documentation'
    files:
      - '*.md'
      - 'docs/**/*.md'
  - label: 'ci'
    files:
      - '.github/**/*'
  - label: 'infrastructure'
    files:
      - 'deployments/helm/**/*'
      - 'deployments/terraform/**/*'
  - label: 'dependencies'
    files:
      - 'go.mod'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - 'package.json'
    title:
      - '/dependabot/'
  - label: 'test'
    files:
      - 'tests/**/*'
