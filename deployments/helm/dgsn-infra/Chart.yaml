apiVersion: v2
name: dgsn-infra
description: DGSN Infrastructure - Redis, OpenTelemetry, Prometheus, Grafana, MinIO
type: application
version: 0.1.0
appVersion: "0.1.0"
icon: https://dgsn.io/icon.svg
keywords:
  - dgsn
  - infrastructure
  - redis
  - monitoring
  - observability
  - storage
home: https://dgsn.io
sources:
  - https://github.com/decentralized-ground-station-network
maintainers:
  - name: DGSN Team
    email: dev@dgsn.io
dependencies:
  - name: redis
    version: ~19.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: ~25.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: ~8.0
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: minio
    version: ~5.0
    repository: https://charts.min.io/
    condition: minio.enabled
annotations:
  artifacthub.io/category: infrastructure
  artifacthub.io/license: MIT
