{{- if .Values.otelCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-otel-collector
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "dgsn-infra.labels" . | nindent 6 }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "dgsn-infra.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          args:
            - --config=/etc/otel/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dgsn-infra.fullname" . }}-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-otel-collector
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  ports:
    - port: 4317
      name: otlp-grpc
    - port: 4318
      name: otlp-http
    - port: 8889
      name: metrics
  selector:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-otel-collector
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.otelCollector.config | nindent 4 }}
{{- end }}
