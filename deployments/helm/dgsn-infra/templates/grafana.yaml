{{- if not .Values.grafana.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-grafana
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  serviceName: {{ include "dgsn-infra.fullname" . }}-grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "dgsn-infra.labels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "dgsn-infra.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dgsn-grafana-admin
                  key: password
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel,grafana-worldmap-panel"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-grafana
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  ports:
    - port: 3000
      name: http
  selector:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
