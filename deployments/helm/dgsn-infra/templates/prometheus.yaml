{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: {{ include "dgsn-infra.fullname" . }}
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
spec:
  replicas: 2
  shards: 1
  retention: "15d"
  scrapeInterval: "30s"
  evaluationInterval: "30s"
  serviceAccountName: {{ include "dgsn-infra.fullname" . }}-prometheus
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  ruleNamespaceSelector: {}
  ruleSelector: {}
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: "gp3"
        resources:
          requests:
            storage: 50Gi
  additionalScrapeConfigs:
    name: {{ include "dgsn-infra.fullname" . }}-additional-scrape-configs
    key: additional-scrape-configs.yaml
  alerting:
    alertmanagers:
      - namespace: {{ .Release.Namespace }}
        name: {{ include "dgsn-infra.fullname" . }}-alertmanager
        port: web
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 8Gi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-backend
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dgsn-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  namespaceSelector:
    any: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-crypto
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dgsn-crypto
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    any: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-quantum
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dgsn-quantum
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    any: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-signal
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dgsn-signal
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
  namespaceSelector:
    any: true
{{- end }}
