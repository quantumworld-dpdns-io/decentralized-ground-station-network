{{- if .Values.redis.cluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dgsn-infra.fullname" . }}-redis-cluster
  labels:
    {{- include "dgsn-infra.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    aof-use-rdb-preamble yes
    maxmemory 1gb
    maxmemory-policy allkeys-lru

  sentinel.conf: |
    bind 0.0.0.0
    port 26379
    sentinel monitor dgsn-redis redis-master 6379 2
    sentinel down-after-milliseconds dgsn-redis 5000
    sentinel parallel-syncs dgsn-redis 1
    sentinel failover-timeout dgsn-redis 10000
{{- end }}
