apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgsn-signal.fullname" . }}
  labels:
    {{- include "dgsn-signal.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dgsn-signal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dgsn-signal.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dgsn-signal.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SDR_ENABLED
              value: {{ .Values.sdr.enabled | quote }}
            - name: SDR_SAMPLE_RATE
              value: {{ .Values.sdr.sampleRate | quote }}
            - name: SDR_CENTER_FREQ
              value: {{ .Values.sdr.centerFreq | quote }}
            - name: SDR_GAIN
              value: {{ .Values.sdr.gain | quote }}
            - name: SIGNAL_FFT_SIZE
              value: {{ .Values.signal.fftSize | quote }}
            - name: SIGNAL_WINDOW
              value: {{ .Values.signal.window | quote }}
            - name: SIGNAL_DETECTION_THRESHOLD
              value: {{ .Values.signal.detectionThreshold | quote }}
            - name: STORAGE_MINIO_ENDPOINT
              value: {{ .Values.storage.minio.endpoint | quote }}
            - name: STORAGE_MINIO_BUCKET
              value: {{ .Values.storage.minio.bucket | quote }}
            - name: STORAGE_MINIO_USE_SSL
              value: {{ .Values.storage.minio.useSSL | quote }}
          envFrom:
            - secretRef:
                name: {{ include "dgsn-signal.fullname" . }}-env
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.sdr.hostDevices }}
            - name: {{ . | replace "/" "-" | trimPrefix "-" }}
              mountPath: {{ . }}
            {{- end }}
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        {{- range .Values.sdr.hostDevices }}
        - name: {{ . | replace "/" "-" | trimPrefix "-" }}
          hostPath:
            path: {{ . }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "dgsn-signal.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
