apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgsn-signal.fullname" . }}
  labels:
    {{- include "dgsn-signal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "dgsn-signal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgsn-signal.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: signal
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: DGSN_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: DGSN_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DGSN_SAMPLE_RATE
              value: {{ .Values.config.sampleRate | quote }}
            - name: DGSN_FFT_SIZE
              value: {{ .Values.config.fftSize | quote }}
            - name: DGSN_SIGNAL_THRESHOLD
              value: {{ .Values.config.signalDetection.threshold | quote }}
            - name: DGSN_OTLP_ENDPOINT
              value: {{ .Values.config.telemetry.otlpEndpoint | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
