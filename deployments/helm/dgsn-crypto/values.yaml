replicaCount: 2

image:
  repository: ghcr.io/decentralized-ground-station-network/crypto
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: true
  name: dgsn-crypto

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8090
  metricsPort: 9091

resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 1
    memory: 2Gi

config:
  environment: production
  logLevel: info
  pqc:
    enabled: true
    kemAlgorithm: kyber-1024
    signatureAlgorithm: dilithium-5
    hybridMode: true
    tlsMinVersion: "1.3"
    supportedCurves:
      - X25519MLKEM768
      - secp384r1
      - X448
  rateLimit:
    enabled: true
    requestsPerSecond: 1000
  telemetry:
    enabled: true
    otlpEndpoint: dgsn-otel-collector:4317

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
