apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgsn-crypto.fullname" . }}
  labels:
    {{- include "dgsn-crypto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dgsn-crypto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgsn-crypto.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: crypto
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: DGSN_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: DGSN_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DGSN_PQC_ENABLED
              value: {{ .Values.config.pqc.enabled | quote }}
            - name: DGSN_KEM_ALGORITHM
              value: {{ .Values.config.pqc.kemAlgorithm | quote }}
            - name: DGSN_SIG_ALGORITHM
              value: {{ .Values.config.pqc.signatureAlgorithm | quote }}
            - name: DGSN_HYBRID_MODE
              value: {{ .Values.config.pqc.hybridMode | quote }}
            - name: DGSN_OTLP_ENDPOINT
              value: {{ .Values.config.telemetry.otlpEndpoint | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
