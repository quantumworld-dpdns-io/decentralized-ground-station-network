apiVersion: v1
kind: Service
metadata:
  name: {{ include "dgsn-crypto.fullname" . }}
  labels:
    {{- include "dgsn-crypto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "dgsn-crypto.selectorLabels" . | nindent 4 }}
