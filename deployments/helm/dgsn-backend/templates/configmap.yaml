apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dgsn-backend.fullname" . }}-config
  labels:
    {{- include "dgsn-backend.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      httpPort: {{ .Values.config.server.httpPort }}
      grpcPort: {{ .Values.config.server.grpcPort }}
      readTimeout: {{ .Values.config.server.readTimeout }}
      writeTimeout: {{ .Values.config.server.writeTimeout }}
      shutdownTimeout: {{ .Values.config.server.shutdownTimeout }}

    auth:
      enabled: {{ .Values.config.auth.enabled }}
      tokenExpiry: {{ .Values.config.auth.tokenExpiry }}

    logging:
      level: {{ .Values.config.logging.level }}
      format: {{ .Values.config.logging.format }}

    metrics:
      enabled: {{ .Values.config.metrics.enabled }}
      path: {{ .Values.config.metrics.path }}

    tracing:
      enabled: {{ .Values.config.tracing.enabled }}
      endpoint: {{ .Values.config.tracing.endpoint }}
      serviceName: {{ .Values.config.tracing.serviceName }}

    redis:
      poolSize: {{ .Values.redis.poolSize }}
      minIdleConns: {{ .Values.redis.minIdleConns }}

    minio:
      bucket: {{ .Values.minio.bucket }}
