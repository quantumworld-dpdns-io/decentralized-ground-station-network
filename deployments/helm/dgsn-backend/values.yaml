replicaCount: 3

image:
  repository: ghcr.io/dgsn/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  grpc:
    port: 50051

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.dgsn.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /healthz
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
  tls:
    - secretName: dgsn-backend-tls
      hosts:
        - api.dgsn.local

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dgsn-frontend
      ports:
        - port: 8080
          protocol: TCP
        - port: 50051
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dgsn-crypto
      ports:
        - port: 50051
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dgsn-quantum
      ports:
        - port: 50052
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dgsn-signal
      ports:
        - port: 50053
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP

nodeSelector:
  kubernetes.io/os: linux

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - dgsn-backend
          topologyKey: kubernetes.io/hostname

env:
  LOG_LEVEL: info
  ENVIRONMENT: production
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"

config:
  server:
    httpPort: 8080
    grpcPort: 50051
    readTimeout: 30s
    writeTimeout: 30s
    shutdownTimeout: 15s

  auth:
    enabled: true
    jwtSecret: ""
    tokenExpiry: 24h

  logging:
    level: info
    format: json

  metrics:
    enabled: true
    path: /metrics

  tracing:
    enabled: true
    endpoint: "otel-collector:4317"
    serviceName: "dgsn-backend"

redis:
  host: "redis-master"
  port: 6379
  password: ""
  db: 0
  poolSize: 20
  minIdleConns: 5

minio:
  endpoint: "minio:9000"
  accessKey: ""
  secretKey: ""
  useSSL: false
  bucket: "dgsn-signals"

grpc:
  services:
    crypto: "dgsn-crypto:50051"
    quantum: "dgsn-quantum:50052"
    signal: "dgsn-signal:50053"
