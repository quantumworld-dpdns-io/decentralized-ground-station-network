receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  attributes:
    actions:
      - key: dgsn.environment
        value: production
        action: upsert
      - key: dgsn.trace_pipeline
        value: head-sampling
        action: upsert

  resourcedetection:
    detectors: [ec2, gcp, azure, system]
    timeout: 10s

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.container.name

  filter:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.method"] != "OPTIONS"'
        - 'attributes["healthcheck"] != true'

  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors-priority
        type: status_code
        config:
          status_code: ERROR
          min_number_of_spans: 1
      - name: high-latency
        type: latency
        config:
          threshold_ms: 1000
      - name: dgsn-receipts
        type: string_attribute
        config:
          key: dgsn.operation
          values: [receipt_create, receipt_verify, receipt_chain]
          min_number_of_spans: 1
      - name: dgsn-quantum
        type: string_attribute
        config:
          key: dgsn.operation
          values: [circuit_optimize, qaoa_schedule, vqe_allocate]
          min_number_of_spans: 1
      - name: probabilistic
        type: probabilistic
        config:
          sampling_percentage: 20

  probabilistic_sampler:
    hash_seed: dgsn-v1
    sampling_percentage: 50

  span:
    name: "dgsn-trace-processor"

  transform:
    trace_statements:
      - context: span
        statements:
          - set(status.code, 1) where attributes["http.status_code"] >= 400
          - set(attributes["sampled_by"], "dgsn-head-sampler") where attributes["dgsn.operation"] != nil

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 10000
      num_consumers: 10
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 50

service:
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, batch, resourcedetection, k8sattributes, attributes, filter, tail_sampling, probabilistic_sampler, span, transform]
      exporters: [otlp, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
