receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
      load: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
        metrics:
          system.network.packets:
            enabled: true
      paging: {}
      processes: {}

  prometheus:
    config:
      scrape_configs:
        - job_name: "dgsn-backend"
          scrape_interval: 10s
          metrics_path: /metrics
          static_configs:
            - targets: ["backend:9090"]
        - job_name: "dgsn-crypto-kernel"
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["crypto-kernel:50050"]
        - job_name: "dgsn-quantum-engine"
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: ["quantum-engine:50051"]
        - job_name: "dgsn-signal"
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["signal-processing:50052"]
        - job_name: "dgsn-node"
          scrape_interval: 30s
          static_configs:
            - targets: ["node-exporter:9100"]
        - job_name: "dgsn-postgres"
          scrape_interval: 30s
          static_configs:
            - targets: ["postgres-exporter:9187"]
        - job_name: "dgsn-redis"
          scrape_interval: 30s
          static_configs:
            - targets: ["redis-exporter:9121"]
        - job_name: "dgsn-vector-db"
          scrape_interval: 30s
          static_configs:
            - targets: ["vector-db:6333"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 2000
    send_batch_max_size: 4000

  memory_limiter:
    check_interval: 5s
    limit_mib: 1024
    spike_limit_mib: 256

  attributes:
    actions:
      - key: dgsn.environment
        value: production
        action: upsert
      - key: dgsn.metric_pipeline
        value: metrics-only
        action: upsert

  resourcedetection:
    detectors: [ec2, gcp, azure, system]
    timeout: 10s

  filter:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name != "process.runtime.jvm.*"'

  cumulative_to_delta:
    max_staleness: 5m

  metricstransform:
    transforms:
      - include: ^system\.(cpu|memory|disk|network)\..*
        match_type: regexp
        action: update
        new_name: dgsn.system.${1}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: dgsn
    const_labels:
      pipeline: metrics
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    add_metric_suffixes: false

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      cluster: dgsn-production

  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 100

service:
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics, prometheus]
      processors: [memory_limiter, batch, resourcedetection, attributes, filter, cumulative_to_delta, metricstransform]
      exporters: [prometheus, prometheusremotewrite, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
