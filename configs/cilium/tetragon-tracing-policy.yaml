apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "dgsn-tracing-policy"
spec:
  kprobes:
    - call: "sys_read"
      syscall: true
      args:
        - index: 0
          type: int
        - index: 1
          type: bytearray
        - index: 2
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
              argError: true
    - call: "sys_write"
      syscall: true
      args:
        - index: 0
          type: int
        - index: 1
          type: bytearray
        - index: 2
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "1"
          matchActions:
            - action: Post
              argError: true
    - call: "sys_connect"
      syscall: true
      args:
        - index: 0
          type: int
        - index: 1
          type: sockaddr
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
              argError: true
    - call: "sys_accept"
      syscall: true
      args:
        - index: 0
          type: int
        - index: 1
          type: sockaddr
        - index: 2
          type: sockaddr
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
              argError: true
    - call: "sys_open"
      syscall: true
      args:
        - index: 0
          type: string
        - index: 1
          type: int
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/dgsn/"
                - "/var/lib/dgsn/"
                - "/data/receipts/"
                - "/dev/sdr"
                - "/dev/bus/usb"
                - "/tmp/dgsn-sdr"
          matchActions:
            - action: Post
              argError: true
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: string
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchNamespaces:
            - namespace: "probe"
              operator: In
              values:
                - "host"
          matchActions:
            - action: Post
              argError: true
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/dgsn/"
                - "/etc/dgsn/secrets/"
          matchActions:
            - action: Post
              argError: true
    - call: "tcp_sendmsg"
      syscall: false
      args:
        - index: 0
          type: sock
        - index: 1
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
    - call: "tcp_recvmsg"
      syscall: false
      args:
        - index: 0
          type: sock
        - index: 1
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
    - call: "sock_sendmsg"
      syscall: false
      args:
        - index: 0
          type: sock
        - index: 1
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
    - call: "sock_recvmsg"
      syscall: false
      args:
        - index: 0
          type: sock
        - index: 1
          type: size_t
      selectors:
        - matchPIDs:
            - operator: In
              followForks: true
              values:
                - 0
          matchActions:
            - action: Post
    - call: "sched_process_exec"
      syscall: false
      args:
        - index: 0
          type: string
      selectors:
        - matchNamespaces:
            - namespace: "probe"
              operator: In
              values:
                - "host"
          matchArgs:
            - index: 0
              operator: "In"
              values:
                - "/usr/local/bin/julia"
                - "/usr/local/bin/python3"
                - "/usr/local/bin/dgsn-signal-processor"
                - "/usr/local/bin/dgsn-crypto-cli"
                - "/usr/local/bin/dgsn-server"
          matchActions:
            - action: FollowFD
            - action: Post
    - call: "sched_process_exit"
      syscall: false
      args:
        - index: 0
          type: int
      selectors:
        - matchNamespaces:
            - namespace: "probe"
              operator: In
              values:
                - "host"
          matchActions:
            - action: Post

  processKprobes:
    - call: "sched_process_exec"
      syscall: false
      args:
        - index: 0
          type: string
    - call: "sched_process_exit"
      syscall: false
      args:
        - index: 0
          type: int

  processExec:
    matchArgs:
      - index: 0
        operator: "In"
        values:
          - "/usr/local/bin/julia"
          - "/usr/local/bin/python3"
          - "/usr/local/bin/dgsn-signal-processor"
          - "/usr/local/bin/dgsn-crypto-cli"
          - "/usr/local/bin/dgsn-server"
          - "/usr/local/bin/dgsn-cli"
    matchActions:
      - action: FollowFD
      - action: Post

  processFork:
    matchParentArgs:
      - index: 0
        operator: "In"
        values:
          - "/usr/local/bin/julia"
          - "/usr/local/bin/python3"
          - "/usr/local/bin/dgsn-signal-processor"
          - "/usr/local/bin/dgsn-crypto-cli"

  fileAccess:
    - matchPaths:
        - prefix: "/dev/bus/usb"
        - prefix: "/dev/sdr"
        - prefix: "/tmp/dgsn-sdr"
        - prefix: "/data/receipts"
        - prefix: "/var/log/dgsn"
        - prefix: "/etc/dgsn/secrets"
      matchOperations:
        - "read"
        - "write"
      matchActions:
        - action: Post

  network:
    egress:
      - matchDestinations:
          - operator: "In"
            values:
              - "redis-primary:6379"
              - "backend:9090"
              - "otel-collector:4317"
              - "crypto-kernel:50051"
              - "quantum-engine:50052"
              - "signal-processing:50053"
              - "minio:9000"
      - matchProtocols:
          - "tcp"
      - matchPorts:
          - "6379"
          - "9090"
          - "4317"
          - "50051"
          - "50052"
          - "50053"
          - "9000"
