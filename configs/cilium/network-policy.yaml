apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: "dgsn-egress-dns"
  namespace: dgsn
spec:
  description: "Allow DNS egress for all pods"
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: "dgsn-egress-ntp"
  namespace: dgsn
spec:
  description: "Allow NTP egress for time sync"
  endpointSelector:
    matchLabels:
      app: dgsn-backend
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "123"
              protocol: UDP
---
