[server]
protocol = http
http_port = 3000
domain = dgsn.local
root_url = http://localhost:3000
enable_gzip = true
static_root_path = /usr/share/grafana/public

[security]
admin_user = ${GRAFANA_USER:-admin}
admin_password = ${GRAFANA_PASSWORD:-admin}
secret_key = ${GRAFANA_SECRET_KEY}
login_remember_days = 30
cookie_secure = false
disable_gravatar = false
data_source_proxy_whitelist = prometheus:9090,loki:3100,tempo:3200

[auth]
disable_login_form = false
oauth_auto_login = false
oauth_state_cookie_max_age = 600

[auth.basic]
enabled = true

[auth.anonymous]
enabled = false

[users]
default_theme = dark
home_page = /dashboards
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[analytics]
check_for_updates = false
reporting_enabled = false

[explore]
enabled = true

[log]
mode = console
level = info

[metrics]
enabled = true
interval_seconds = 15
basic_auth_username = grafana_metrics
basic_auth_password = ${GRAFANA_METRICS_PASSWORD}

[alerting]
enabled = true
execute_alerts = true
concurrent_render_limit = 5

[unified_alerting]
enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/ground-station-overview.json

[dashboards.versions]
enabled = false

[snapshots]
enabled = false

[plugins]
allow_loading_unsigned_plugins = dgsn-panel

[feature_toggles]
enable = transformations variableDuration

[panels]
enable_alpha = false
disable_sanitize_html = false
