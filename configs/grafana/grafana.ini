[server]
protocol = http
http_port = 3000
domain = dgsn.local
root_url = https://dgsn.example.com
enable_gzip = true
static_root_path = /usr/share/grafana/public

[server.smtp]
enabled = true
host = ${SMTP_HOST:localhost:25}
user = ${SMTP_USER}
password = ${SMTP_PASSWORD}
from_address = grafana@dgsn.example.com
from_name = DGSN Grafana Alerts

[security]
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}
secret_key = ${GRAFANA_SECRET_KEY}
login_remember_days = 30
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true
data_source_proxy_whitelist = prometheus:9090 loki:3100 tempo:3200 jaeger:16686

[auth]
disable_login_form = true
oauth_auto_login = true
oauth_state_cookie_max_age = 600
signout_redirect_url = https://auth.dgsn.example.com/logout

[auth.generic_oauth]
enabled = true
name = DGSN OIDC
icon = signin
client_id = ${OAUTH_CLIENT_ID}
client_secret = ${OAUTH_CLIENT_SECRET}
scopes = openid profile email roles
auth_url = https://auth.dgsn.example.com/oauth2/authorize
token_url = https://auth.dgsn.example.com/oauth2/token
api_url = https://auth.dgsn.example.com/oauth2/userinfo
allow_sign_up = true
auto_login = false
role_attribute_path = contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[users]
default_theme = dark
home_page = /dashboards
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false

[analytics]
check_for_updates = false
reporting_enabled = false
feedback_links_enabled = false

[explore]
enabled = true

[log]
mode = console
level = info
filters = alerting:debug

[metrics]
enabled = true
interval_seconds = 15
basic_auth_username = grafana_metrics
basic_auth_password = ${GRAFANA_METRICS_PASSWORD}

[alerting]
enabled = true
execute_alerts = true
concurrent_render_limit = 5
notification_timeout = 30s

[unified_alerting]
enabled = true
admin_config_poll_interval = 60s
alerting_config_poll_interval = 60s
max_attempts = 3
min_interval = 30s

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/ground-station-overview.json
versions_to_keep = 20

[dashboards.versions]
enabled = false

[snapshots]
enabled = false

[plugins]
allow_loading_unsigned_plugins = dgsn-panel

[feature_toggles]
enable = transformations variableDuration alertingSimplified

[panels]
enable_alpha = false
disable_sanitize_html = false

[external_image_storage]
provider = s3

[external_image_storage.s3]
bucket = dgsn-grafana-images
region = us-east-1
access_key = ${AWS_ACCESS_KEY_ID}
secret_key = ${AWS_SECRET_ACCESS_KEY}

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/ground-station-overview.json
