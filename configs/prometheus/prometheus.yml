      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          component: observability

  - job_name: "dgsn-node"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node
          component: infrastructure

  - job_name: "dgsn-vector-db"
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["vector-db:6333"]
