global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: dgsn-production
    namespace: dgsn

rule_files:
  - "alert-rules.yml"
  - "recording-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: "dgsn-backend"
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend
          component: api

  - job_name: "dgsn-crypto-kernel"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["crypto-kernel:50050"]
        labels:
          service: crypto-kernel
          component: crypto

  - job_name: "dgsn-quantum-engine"
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["quantum-engine:50051"]
        labels:
          service: quantum-engine
          component: quantum

  - job_name: "dgsn-signal-processing"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["signal-processing:50052"]
        labels:
          service: signal-processing
          component: signal

  - job_name: "dgsn-postgres"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          component: database

  - job_name: "dgsn-redis"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
