# DGSN Redis Cluster Configuration
# Redis 7.x cluster for distributed caching and state management
# Minimum 3 masters, 3 replicas (6 nodes total)

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Cluster mode
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-node-timeout 5000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage no
cluster-allow-reads-when-down no
cluster-replica-no-failover no

# Security
requirepass fd8a2e1c9b7f3d5a4e6b2c8d0f1a3e5b7c9d0f2
masterauth fd8a2e1c9b7f3d5a4e6b2c8d0f1a3e5b7c9d0f2
protected-mode yes

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# Memory
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Eviction tuning
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# Keyspace events for pub/sub
notify-keyspace-events KEA

# Limits
maxclients 20000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 256

# Latency monitor
latency-monitor-threshold 100

# Replication tuning
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no

# Cluster node configuration
# Each cluster node should set these to its specific IP/port:
# replica-announce-ip <node-ip>
# replica-announce-port <node-port>

# TLS (optional)
# tls-cluster yes
# tls-replication yes
# tls-port 0

# Logging
loglevel notice
logfile /var/log/redis/cluster.log
