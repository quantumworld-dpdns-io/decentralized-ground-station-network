# DGSN Redis Sentinel Configuration
# Redis 7.x Sentinel for high-availability failover
# Three sentinel nodes minimum for quorum

port 26379
daemonize no
pidfile /var/run/redis-sentinel.pid
logfile /var/log/redis/sentinel.log
loglevel notice

# Working directory
dir /tmp

# DGSN master configuration
sentinel monitor dgsn-master redis-primary 6379 2
sentinel auth-pass dgsn-master fd8a2e1c9b7f3d5a4e6b2c8d0f1a3e5b7c9d0f2
sentinel down-after-milliseconds dgsn-master 5000
sentinel parallel-syncs dgsn-master 1
sentinel failover-timeout dgsn-master 10000
sentinel deny-scripts-reconfig yes

# Notification scripts
sentinel notification-script dgsn-master /usr/local/bin/dgsn-sentinel-notify.sh

# Client reconfiguration
sentinel client-reconfig-script dgsn-master /usr/local/bin/dgsn-sentinel-reconfig.sh

# Security
protected-mode yes
bind 0.0.0.0

# ACL
aclfile /etc/redis/sentinel-users.acl

# TLS (optional)
# tls-port 26379
# tls-cert-file /etc/redis/certs/sentinel.crt
# tls-key-file /etc/redis/certs/sentinel.key
# tls-ca-cert-file /etc/redis/certs/ca.crt
