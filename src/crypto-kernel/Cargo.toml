[workspace]
members = ["."]
resolver = "2"

[package]
name = "dgsn-crypto-kernel"
version = "0.1.0"
edition = "2021"
description = "Post-quantum cryptographic kernel for DGSN proof-of-reception"
rust-version = "1.78"

[dependencies]
rand = "0.8"
rand_chacha = "0.10"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zeroize = { version = "1.7", features = ["derive"] }
sha3 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
thiserror = "1.0"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
default = ["liboqs"]
liboqs = []
wasm = ["wasm-bindgen", "js-sys", "wasm-bindgen-futures", "getrandom"]
